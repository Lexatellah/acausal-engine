name: tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnostics
        run: |
          python --version
          pip list
          ls -la
          ls -la tests/
          ls -la acausal_engine/

      - name: Import smoke test
        run: python -c "from acausal_engine.quantum_switch import quantum_switch_2qubit, quantum_switch_qudit, fixed_order_process; from acausal_engine.uso import RandomUSO, HypercubeUSO; from acausal_engine.process_matrix import ChoiMatrix; print('ALL IMPORTS OK')"

      - name: Collect tests
        run: python -m pytest tests/ --collect-only -q

      - name: Run tests
        run: python -m pytest tests/ -v --tb=long -p no:cacheprovider
        env:
          PYTHONPATH: ${{ github.workspace }}
